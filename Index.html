<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Solar System</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@300;400;600&display=swap');
        
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; font-family: 'Exo 2', sans-serif; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        .tooltip {
            position: absolute;
            background: linear-gradient(135deg, rgba(10, 20, 40, 0.95), rgba(20, 40, 80, 0.9));
            border: 1px solid rgba(100, 180, 255, 0.5);
            border-radius: 12px;
            padding: 14px;
            color: white;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            max-width: 280px;
            z-index: 1000;
            backdrop-filter: blur(15px);
            box-shadow: 0 0 30px rgba(74, 144, 217, 0.3), inset 0 0 20px rgba(74, 144, 217, 0.1);
            transform: scale(0.95);
        }
        
        .tooltip.visible { 
            opacity: 1; 
            transform: scale(1);
        }
        
        /* Mobile toggle buttons */
        .mobile-toggle {
            display: none;
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(10, 20, 40, 0.95), rgba(20, 40, 80, 0.9));
            border: 1px solid rgba(100, 180, 255, 0.5);
            color: #64b5f6;
            font-size: 1.5rem;
            z-index: 200;
            cursor: pointer;
            backdrop-filter: blur(15px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: all 0.3s;
            align-items: center;
            justify-content: center;
        }
        
        .mobile-toggle:hover, .mobile-toggle.active {
            background: linear-gradient(135deg, rgba(74, 144, 217, 0.4), rgba(74, 144, 217, 0.2));
            box-shadow: 0 0 25px rgba(74, 144, 217, 0.5);
        }
        
        .toggle-controls {
            top: 10px;
            left: 10px;
        }
        
        .toggle-planets {
            top: 10px;
            right: 10px;
        }
        
        .control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, rgba(10, 20, 40, 0.95), rgba(20, 40, 80, 0.9));
            border: 1px solid rgba(100, 180, 255, 0.4);
            border-radius: 16px;
            padding: 20px;
            color: white;
            z-index: 100;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 40px rgba(74, 144, 217, 0.2);
            min-width: 240px;
            max-width: 280px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        
        .panel-title {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            background: linear-gradient(90deg, #64b5f6, #42a5f5, #64b5f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(100, 180, 255, 0.5);
            animation: shimmer 3s ease-in-out infinite;
        }
        
        @keyframes shimmer {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }
        
        .slider-container {
            margin: 14px 0;
        }
        
        .slider-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.8rem;
            color: #a0c4e8;
        }
        
        .slider-value {
            background: rgba(74, 144, 217, 0.3);
            padding: 2px 8px;
            border-radius: 10px;
            font-family: 'Orbitron', monospace;
            font-size: 0.7rem;
        }
        
        .slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(90deg, rgba(30, 50, 80, 0.8), rgba(50, 80, 120, 0.8));
            outline: none;
            -webkit-appearance: none;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #64b5f6, #1976d2);
            cursor: pointer;
            box-shadow: 0 0 15px rgba(74, 144, 217, 0.7), 0 0 30px rgba(74, 144, 217, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            box-shadow: 0 0 20px rgba(74, 144, 217, 0.9), 0 0 40px rgba(74, 144, 217, 0.6);
        }
        
        .planet-list {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, rgba(10, 20, 40, 0.95), rgba(20, 40, 80, 0.9));
            border: 1px solid rgba(100, 180, 255, 0.4);
            border-radius: 16px;
            padding: 16px;
            color: white;
            z-index: 100;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 40px rgba(74, 144, 217, 0.2);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        
        .planet-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 8px 12px;
            margin: 4px 0;
            background: linear-gradient(90deg, rgba(74, 144, 217, 0.15), rgba(74, 144, 217, 0.05));
            border: 1px solid rgba(100, 180, 255, 0.2);
            border-radius: 10px;
            color: #c8e0f4;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-size: 0.85rem;
        }
        
        .planet-btn:hover, .planet-btn:active {
            background: linear-gradient(90deg, rgba(74, 144, 217, 0.4), rgba(74, 144, 217, 0.2));
            border-color: rgba(100, 180, 255, 0.6);
            box-shadow: 0 0 20px rgba(74, 144, 217, 0.3);
        }
        
        .planet-btn.active {
            background: linear-gradient(90deg, rgba(74, 144, 217, 0.5), rgba(74, 144, 217, 0.3));
            border-color: #64b5f6;
            box-shadow: 0 0 25px rgba(74, 144, 217, 0.5);
        }
        
        .planet-icon {
            font-size: 1.1rem;
        }
        
        .instructions {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(10, 20, 40, 0.9), rgba(20, 40, 80, 0.85));
            border: 1px solid rgba(100, 180, 255, 0.4);
            border-radius: 12px;
            padding: 10px 16px;
            color: #a0c4e8;
            font-size: 12px;
            z-index: 100;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            white-space: nowrap;
        }
        
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0;
            cursor: pointer;
            color: #a0c4e8;
            font-size: 0.85rem;
            transition: color 0.3s;
        }
        
        .checkbox-container:hover {
            color: #64b5f6;
        }
        
        .custom-checkbox {
            width: 20px;
            height: 20px;
            min-width: 20px;
            border: 2px solid rgba(100, 180, 255, 0.5);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .custom-checkbox.checked {
            background: linear-gradient(135deg, #64b5f6, #1976d2);
            border-color: #64b5f6;
            box-shadow: 0 0 10px rgba(74, 144, 217, 0.5);
        }
        
        .custom-checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        
        .reset-btn {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            background: linear-gradient(135deg, #1976d2, #1565c0);
            border: none;
            border-radius: 10px;
            color: white;
            font-family: 'Exo 2', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(25, 118, 210, 0.4);
        }
        
        .reset-btn:hover, .reset-btn:active {
            background: linear-gradient(135deg, #1e88e5, #1976d2);
            box-shadow: 0 6px 25px rgba(25, 118, 210, 0.6);
        }
        
        .tracking-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.5s;
        }
        
        .tracking-indicator.visible {
            opacity: 1;
        }
        
        .tracking-ring {
            width: 60px;
            height: 60px;
            border: 2px solid rgba(100, 180, 255, 0.6);
            border-radius: 50%;
            animation: pulse-ring 2s ease-out infinite;
        }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        
        .tracking-name {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Orbitron', monospace;
            color: #64b5f6;
            font-size: 0.85rem;
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(100, 180, 255, 0.8);
        }
        
        /* Planet grid for mobile */
        .planet-grid {
            display: none;
        }
        
        /* Mobile Styles */
        @media (max-width: 768px) {
            .mobile-toggle {
                display: flex;
            }
            
            .control-panel {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: auto;
                max-width: 100%;
                width: 100%;
                border-radius: 0 0 20px 20px;
                padding: 60px 16px 20px 16px;
                transform: translateY(-100%);
                opacity: 0;
                pointer-events: none;
                max-height: 70vh;
                overflow-y: auto;
            }
            
            .control-panel.visible {
                transform: translateY(0);
                opacity: 1;
                pointer-events: auto;
            }
            
            .planet-list {
                position: fixed;
                top: 0;
                right: 0;
                left: 0;
                bottom: auto;
                width: 100%;
                max-width: 100%;
                border-radius: 0 0 20px 20px;
                padding: 60px 16px 20px 16px;
                transform: translateY(-100%);
                opacity: 0;
                pointer-events: none;
                max-height: 70vh;
                overflow-y: auto;
            }
            
            .planet-list.visible {
                transform: translateY(0);
                opacity: 1;
                pointer-events: auto;
            }
            
            .planet-list .planet-btn-list {
                display: none;
            }
            
            .planet-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            
            .planet-grid .planet-btn {
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 12px 8px;
                text-align: center;
                gap: 4px;
            }
            
            .planet-grid .planet-icon {
                font-size: 1.5rem;
            }
            
            .planet-grid .planet-btn span:last-child {
                font-size: 0.7rem;
            }
            
            .instructions {
                display: none;
            }
            
            .mobile-instructions {
                display: block;
                position: absolute;
                bottom: 10px;
                left: 10px;
                right: 10px;
                background: linear-gradient(135deg, rgba(10, 20, 40, 0.9), rgba(20, 40, 80, 0.85));
                border: 1px solid rgba(100, 180, 255, 0.4);
                border-radius: 12px;
                padding: 10px;
                color: #a0c4e8;
                font-size: 11px;
                text-align: center;
                z-index: 100;
                backdrop-filter: blur(10px);
            }
            
            .panel-title {
                font-size: 1rem;
            }
            
            .slider-container {
                margin: 10px 0;
            }
            
            .tracking-indicator {
                top: 45%;
            }
            
            .tracking-ring {
                width: 50px;
                height: 50px;
            }
            
            .tracking-name {
                font-size: 0.75rem;
            }
            
            .tooltip {
                max-width: 200px;
                padding: 10px;
                font-size: 0.8rem;
            }
            
            .close-panel {
                display: block;
                position: absolute;
                top: 12px;
                right: 12px;
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: rgba(255, 100, 100, 0.2);
                border: 1px solid rgba(255, 100, 100, 0.5);
                color: #ff8888;
                font-size: 1.2rem;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
            }
        }
        
        @media (min-width: 769px) {
            .mobile-instructions {
                display: none;
            }
            
            .close-panel {
                display: none;
            }
            
            .planet-btn-list {
                display: block;
            }
        }
        
        /* Landscape mobile */
        @media (max-width: 768px) and (orientation: landscape) {
            .control-panel, .planet-list {
                max-height: 85vh;
            }
            
            .planet-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }
    </style>
</head>
<body class="bg-black">

            <button class="planet-btn" data-planet="neptune"><span class="planet-icon">💙</span> Neptune</button>

        <!-- Mobile grid view -->
        <div class="planet-grid">

            <button class="planet-btn" data-planet="mercury"><span class="planet-icon">🪨</span><span>Mercury</span></button>
            <button class="planet-btn" data-planet="venus"><span class="planet-icon">🌍</span><span>Venus</span></button>

        <div class="mt-3 pt-3 border-t border-gray-700/50">

                info: {
                    type: "Gas Giant",
                    diameter: "116,460 km",
                    mass: "5.683 × 10²⁶ kg",
                    dayLength: "10.7 hours",
                    yearLength: "29.5 Earth years",
                    moons: "146 known",
                    rings: "Mostly ice and rock"
                }
            },
            uranus: {
                name: "Uranus",
                radius: 4.5,
                distance: 260,
                orbitalPeriod: 84.01,
                rotationPeriod: -0.72,
                color: 0x7de3f4,
                info: {
                    type: "Ice Giant",
                    diameter: "50,724 km",
                    mass: "8.681 × 10²⁵ kg",
                    dayLength: "17.2 hours",
                    yearLength: "84 Earth years",
                    moons: "27 known",
                    temperature: "-224°C"
                }
            },
            neptune: {
                name: "Neptune",
                radius: 4.2,
                distance: 310,
                orbitalPeriod: 164.8,
                rotationPeriod: 0.67,
                color: 0x3d5ef5,
                info: {
                    type: "Ice Giant",
                    diameter: "49,244 km",
                    mass: "1.024 × 10²⁶ kg",
                    dayLength: "16.1 hours",
                    yearLength: "165 Earth years",
                    moons: "16 known",
                    temperature: "-214°C"
                }
            }
        };

        // Store planet meshes and orbits
        const planets = {};
        const orbits = {};
        const labels = {};
        let sunGlow = null;
        let sunCorona = null;
        let asteroidBelt = null;
        let timeSpeed = 1;
        let planetScale = 1;
        let orbitScale = 1;

        // Create starfield background with nebula colors
        function createStarfield() {
            const starGeometry = new THREE.BufferGeometry();
            const starCount = 15000;
            const positions = new Float32Array(starCount * 3);
            const colors = new Float32Array(starCount * 3);
            const sizes = new Float32Array(starCount);

            for (let i = 0; i < starCount; i++) {
                const i3 = i * 3;
                const radius = 1500 + Math.random() * 3000;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                
                positions[i3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                positions[i3 + 2] = radius * Math.cos(phi);

                // Create varied star colors (blue, white, yellow, orange)
                const colorChoice = Math.random();
                const color = new THREE.Color();
                if (colorChoice < 0.3) {
                    color.setHSL(0.6, 0.8, 0.8 + Math.random() * 0.2); // Blue stars
                } else if (colorChoice < 0.6) {
                    color.setHSL(0.15, 0.3, 0.9 + Math.random() * 0.1); // White/yellow stars
                } else if (colorChoice < 0.8) {
                    color.setHSL(0.08, 0.9, 0.7 + Math.random() * 0.2); // Orange stars
                } else {
                    color.setHSL(0.0, 0.8, 0.6 + Math.random() * 0.2); // Red stars
                }
                colors[i3] = color.r;
                colors[i3 + 1] = color.g;
                colors[i3 + 2] = color.b;
                
                sizes[i] = 1 + Math.random() * 3;
            }

            starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const starMaterial = new THREE.PointsMaterial({
                size: 2.5,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                sizeAttenuation: true
            });

            return new THREE.Points(starGeometry, starMaterial);
        }
        
        // Create sun glow effect
        function createSunGlow() {
            const glowGroup = new THREE.Group();
            
            // Inner glow
            const innerGlowGeometry = new THREE.SphereGeometry(25, 32, 32);
            const innerGlowMaterial = new THREE.MeshBasicMaterial({
                color: 0xffaa00,
                transparent: true,
                opacity: 0.4,
                side: THREE.BackSide
            });
            const innerGlow = new THREE.Mesh(innerGlowGeometry, innerGlowMaterial);
            glowGroup.add(innerGlow);
            
            // Outer glow layers
            for (let i = 0; i < 5; i++) {
                const size = 28 + i * 8;
                const glowGeometry = new THREE.SphereGeometry(size, 32, 32);
                const glowMaterial = new THREE.MeshBasicMaterial({
                    color: new THREE.Color().setHSL(0.1 - i * 0.02, 1, 0.5),
                    transparent: true,
                    opacity: 0.15 - i * 0.025,
                    side: THREE.BackSide
                });
                const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                glowGroup.add(glow);
            }
            
            return glowGroup;
        }
        
        // Create corona/flare particles
        function createSunCorona() {
            const particleCount = 2000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount * 3; i += 3) {
                const radius = 22 + Math.random() * 15;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                
                positions[i] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i + 1] = radius * Math.sin(phi) * Math.sin(theta);
                positions[i + 2] = radius * Math.cos(phi);
                
                const color = new THREE.Color();
                color.setHSL(0.1 * Math.random(), 1, 0.7 + Math.random() * 0.3);
                colors[i] = color.r;
                colors[i + 1] = color.g;
                colors[i + 2] = color.b;
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const material = new THREE.PointsMaterial({
                size: 1.5,
                vertexColors: true,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });
            
            return new THREE.Points(geometry, material);
        }
        
        // Create asteroid belt
        function createAsteroidBelt() {
            const asteroidCount = 1500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(asteroidCount * 3);
            const colors = new Float32Array(asteroidCount * 3);
            
            for (let i = 0; i < asteroidCount; i++) {
                const i3 = i * 3;
                const angle = Math.random() * Math.PI * 2;
                const radius = 135 + Math.random() * 20; // Between Mars and Jupiter
                const height = (Math.random() - 0.5) * 8;
                
                positions[i3] = Math.cos(angle) * radius;
                positions[i3 + 1] = height;
                positions[i3 + 2] = Math.sin(angle) * radius;
                
                const brightness = 0.4 + Math.random() * 0.3;
                colors[i3] = brightness;
                colors[i3 + 1] = brightness * 0.9;
                colors[i3 + 2] = brightness * 0.8;
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const material = new THREE.PointsMaterial({
                size: 1,
                vertexColors: true,
                transparent: true,
                opacity: 0.7
            });
            
            return new THREE.Points(geometry, material);
        }

        // Create textured planet
        function createPlanet(key, data) {
            const geometry = new THREE.SphereGeometry(data.radius, 64, 64);
            
            let material;
            if (key === 'sun') {
                material = new THREE.MeshBasicMaterial({
                    color: data.color,
                    emissive: data.emissive
                });
            } else {
                // Create procedural texture
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                
                const baseColor = new THREE.Color(data.color);
                ctx.fillStyle = `rgb(${baseColor.r * 255}, ${baseColor.g * 255}, ${baseColor.b * 255})`;
                ctx.fillRect(0, 0, 512, 256);
                
                // Add noise/detail
                for (let i = 0; i < 5000; i++) {
                    const x = Math.random() * 512;
                    const y = Math.random() * 256;
                    const brightness = 0.8 + Math.random() * 0.4;
                    ctx.fillStyle = `rgba(${baseColor.r * 255 * brightness}, ${baseColor.g * 255 * brightness}, ${baseColor.b * 255 * brightness}, 0.3)`;
                    ctx.fillRect(x, y, 2 + Math.random() * 4, 1 + Math.random() * 2);
                }
                
                // Add bands for gas giants
                if (key === 'jupiter' || key === 'saturn') {
                    for (let i = 0; i < 20; i++) {
                        const y = (i / 20) * 256;
                        const alpha = 0.1 + Math.random() * 0.2;
                        ctx.fillStyle = `rgba(${Math.random() * 50 + 150}, ${Math.random() * 50 + 100}, ${Math.random() * 50 + 50}, ${alpha})`;
                        ctx.fillRect(0, y, 512, 8 + Math.random() * 15);
                    }
                }
                
                const texture = new THREE.CanvasTexture(canvas);
                material = new THREE.MeshStandardMaterial({
                    map: texture,
                    roughness: 0.8,
                    metalness: 0.1
                });
            }

            const mesh = new THREE.Mesh(geometry, material);
            mesh.userData = { key, data };
            
            // Create orbit pivot
            const pivot = new THREE.Object3D();
            pivot.add(mesh);
            mesh.position.x = data.distance * orbitScale;
            
            scene.add(pivot);
            planets[key] = { mesh, pivot, angle: Math.random() * Math.PI * 2 };

            // Add Saturn's rings
            if (data.hasRings) {
                const ringGeometry = new THREE.RingGeometry(data.radius * 1.4, data.radius * 2.2, 64);
                const ringMaterial = new THREE.MeshBasicMaterial({
                    color: 0xc9b896,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.7
                });
                const ring = new THREE.Mesh(ringGeometry, ringMaterial);
                ring.rotation.x = Math.PI / 2;
                mesh.add(ring);
            }

            // Add Earth's moon
            if (key === 'earth') {
                const moonGeometry = new THREE.SphereGeometry(0.8, 32, 32);
                const moonMaterial = new THREE.MeshStandardMaterial({ color: 0xaaaaaa });
                const moon = new THREE.Mesh(moonGeometry, moonMaterial);
                moon.position.x = 6;
                mesh.add(moon);
                planets[key].moon = moon;
                planets[key].moonAngle = 0;
            }

            return { mesh, pivot };
        }

        // Create orbital path
        function createOrbit(distance) {
            const points = [];
            for (let i = 0; i <= 128; i++) {
                const angle = (i / 128) * Math.PI * 2;
                points.push(new THREE.Vector3(
                    Math.cos(angle) * distance * orbitScale,
                    0,
                    Math.sin(angle) * distance * orbitScale
                ));
            }
            
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({
                color: 0x4a90d9,
                transparent: true,
                opacity: 0.3
            });
            
            return new THREE.Line(geometry, material);
        }

        // Create label
        function createLabel(name) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 256;
            canvas.height = 64;
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.roundRect(0, 0, 256, 64, 10);
            ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(name, 128, 40);
            
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(20, 5, 1);
            
            return sprite;
        }

        // Initialize scene
        function init() {
            // Add starfield
            scene.add(createStarfield());

            // Add ambient light
            const ambientLight = new THREE.AmbientLight(0x444444);
            scene.add(ambientLight);

            // Add sun light
            const sunLight = new THREE.PointLight(0xffffff, 2.5, 1500);
            sunLight.position.set(0, 0, 0);
            scene.add(sunLight);
            
            // Add secondary fill light
            const fillLight = new THREE.DirectionalLight(0x4466ff, 0.3);
            fillLight.position.set(-100, 50, -100);
            scene.add(fillLight);

            // Create planets
            Object.keys(planetData).forEach(key => {
                const data = planetData[key];
                createPlanet(key, data);

                if (data.distance > 0) {
                    const orbit = createOrbit(data.distance);
                    orbits[key] = orbit;
                    scene.add(orbit);
                }

                const label = createLabel(data.name);
                labels[key] = label;
                scene.add(label);
            });
            
            // Add sun glow
            sunGlow = createSunGlow();
            scene.add(sunGlow);
            
            // Add sun corona
            sunCorona = createSunCorona();
            scene.add(sunCorona);
            
            // Add asteroid belt
            asteroidBelt = createAsteroidBelt();
            scene.add(asteroidBelt);

            // Set camera position
            updateCamera();
        }

        // Update camera position
        function updateCamera() {
            camera.position.x = targetX + cameraDistance * Math.sin(cameraAngleX) * Math.cos(cameraAngleY);
            camera.position.y = targetY + cameraDistance * Math.sin(cameraAngleY);
            camera.position.z = targetZ + cameraDistance * Math.cos(cameraAngleX) * Math.cos(cameraAngleY);
            camera.lookAt(targetX, targetY, targetZ);
        }
        
        // Track planet - follow it as it moves
        function trackPlanet(key) {
            trackedPlanet = key;
            document.getElementById('stop-tracking').style.display = 'flex';
            document.getElementById('tracking-indicator').classList.add('visible');
            document.getElementById('tracking-name').textContent = 'Tracking: ' + planetData[key].name;
            
            // Update active button state
            document.querySelectorAll('.planet-btn[data-planet]').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.planet === key) btn.classList.add('active');
            });
            
            // Set initial camera distance
            cameraDistance = planetData[key].radius * planetScale * 8 + 40;
        }
        
        function stopTracking() {
            trackedPlanet = null;
            document.getElementById('stop-tracking').style.display = 'none';
            document.getElementById('tracking-indicator').classList.remove('visible');
            document.querySelectorAll('.planet-btn[data-planet]').forEach(btn => btn.classList.remove('active'));
        }

        // Animation loop
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            
            time += 0.001 * timeSpeed;

            Object.keys(planets).forEach(key => {
                const planet = planets[key];
                const data = planetData[key];

                if (data.orbitalPeriod > 0) {
                    planet.angle = time / data.orbitalPeriod;
                    planet.pivot.rotation.y = planet.angle;
                }

                // Rotate planet on its axis
                if (data.rotationPeriod !== 0) {
                    planet.mesh.rotation.y += 0.01 * timeSpeed / Math.abs(data.rotationPeriod);
                }

                // Moon orbit
                if (planet.moon) {
                    planet.moonAngle += 0.02 * timeSpeed;
                    planet.moon.position.x = 6 * Math.cos(planet.moonAngle);
                    planet.moon.position.z = 6 * Math.sin(planet.moonAngle);
                }

                // Update label position
                const worldPos = new THREE.Vector3();
                planet.mesh.getWorldPosition(worldPos);
                labels[key].position.copy(worldPos);
                labels[key].position.y += data.radius * planetScale + 5;
            });
            
            // Update tracked planet camera position
            if (trackedPlanet && planets[trackedPlanet]) {
                const worldPos = new THREE.Vector3();
                planets[trackedPlanet].mesh.getWorldPosition(worldPos);
                targetX = worldPos.x;
                targetY = worldPos.y;
                targetZ = worldPos.z;
                updateCamera();
            }
            
            // Animate sun corona rotation
            if (sunCorona) {
                sunCorona.rotation.y += 0.001 * timeSpeed;
                sunCorona.rotation.x += 0.0005 * timeSpeed;
            }
            
            // Animate sun glow pulsing
            if (sunGlow && showSunGlow) {
                const pulse = 1 + Math.sin(time * 2) * 0.05;
                sunGlow.scale.setScalar(pulse);
            }
            
            // Rotate asteroid belt slowly
            if (asteroidBelt) {
                asteroidBelt.rotation.y += 0.0002 * timeSpeed;
            }

            renderer.render(scene, camera);
        }

        // Tooltip handling
        const tooltip = document.getElementById('tooltip');
        const tooltipName = document.getElementById('tooltip-name');
        const tooltipContent = document.getElementById('tooltip-content');
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            const meshes = Object.values(planets).map(p => p.mesh);
            const intersects = raycaster.intersectObjects(meshes);

            if (intersects.length > 0 && !isDragging) {
                const planet = intersects[0].object;
                const data = planet.userData.data;
                
                tooltipName.textContent = data.name;
                let content = '';
                Object.entries(data.info).forEach(([key, value]) => {
                    const label = key.charAt(0).toUpperCase() + key.slice(1).replace(/([A-Z])/g, ' $1');
                    content += `<p class="text-sm mb-1"><span class="text-blue-400">${label}:</span> ${value}</p>`;
                });
                tooltipContent.innerHTML = content;
                
                tooltip.style.left = event.clientX + 15 + 'px';
                tooltip.style.top = event.clientY + 15 + 'px';
                tooltip.classList.add('visible');
            } else {
                tooltip.classList.remove('visible');
            }
        }

        // Mouse controls
        container.addEventListener('mousedown', (e) => {
            if (e.button === 0) isDragging = true;
            if (e.button === 2) isPanning = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        container.addEventListener('mouseup', () => {
            isDragging = false;
            isPanning = false;
        });

        container.addEventListener('mousemove', (e) => {
            onMouseMove(e);
            
            if (isDragging) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                
                cameraAngleX -= deltaX * 0.005;
                cameraAngleY = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, cameraAngleY + deltaY * 0.005));
                
                updateCamera();
            }
            
            if (isPanning) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                
                targetX -= deltaX * 0.5;
                targetY += deltaY * 0.5;
                
                updateCamera();
            }
            
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        container.addEventListener('wheel', (e) => {
            cameraDistance = Math.max(50, Math.min(800, cameraDistance + e.deltaY * 0.5));
            updateCamera();
        });

        container.addEventListener('contextmenu', (e) => e.preventDefault());

        // Control panel handlers
        document.getElementById('time-speed').addEventListener('input', (e) => {
            timeSpeed = parseFloat(e.target.value) / 10;
            document.getElementById('speed-value').textContent = timeSpeed.toFixed(1) + 'x';
        });

        document.getElementById('planet-scale').addEventListener('input', (e) => {
            planetScale = parseFloat(e.target.value) / 10;
            document.getElementById('scale-value').textContent = planetScale.toFixed(1) + 'x';
            
            Object.keys(planets).forEach(key => {
                const data = planetData[key];
                planets[key].mesh.scale.setScalar(planetScale);
            });
        });

        document.getElementById('orbit-scale').addEventListener('input', (e) => {
            const newOrbitScale = parseFloat(e.target.value) / 10;
            document.getElementById('orbit-value').textContent = newOrbitScale.toFixed(1) + 'x';
            
            Object.keys(planets).forEach(key => {
                const data = planetData[key];
                planets[key].mesh.position.x = data.distance * newOrbitScale;
            });
            
            // Recreate orbits
            Object.keys(orbits).forEach(key => {
                scene.remove(orbits[key]);
                const orbit = createOrbit(planetData[key].distance);
                orbit.scale.setScalar(newOrbitScale / orbitScale);
                orbits[key] = orbit;
                scene.add(orbit);
            });
            
            orbitScale = newOrbitScale;
        });

        // Custom checkbox toggles
        document.getElementById('toggle-orbits').addEventListener('click', function() {
            const checkbox = this.querySelector('.custom-checkbox');
            checkbox.classList.toggle('checked');
            const visible = checkbox.classList.contains('checked');
            Object.values(orbits).forEach(orbit => {
                orbit.visible = visible;
            });
        });

        document.getElementById('toggle-labels').addEventListener('click', function() {
            const checkbox = this.querySelector('.custom-checkbox');
            checkbox.classList.toggle('checked');
            const visible = checkbox.classList.contains('checked');
            Object.values(labels).forEach(label => {
                label.visible = visible;
            });
        });
        
        document.getElementById('toggle-glow').addEventListener('click', function() {
            const checkbox = this.querySelector('.custom-checkbox');
            checkbox.classList.toggle('checked');
            showSunGlow = checkbox.classList.contains('checked');
            if (sunGlow) sunGlow.visible = showSunGlow;
            if (sunCorona) sunCorona.visible = showSunGlow;
        });

        document.getElementById('reset-view').addEventListener('click', () => {
            stopTracking();
            cameraDistance = 300;
            cameraAngleX = 0.5;
            cameraAngleY = 0.3;
            targetX = 0;
            targetY = 0;
            targetZ = 0;
            updateCamera();
        });

        // Planet navigation with tracking
        document.querySelectorAll('.planet-btn[data-planet]').forEach(btn => {
            btn.addEventListener('click', () => {
                const key = btn.dataset.planet;
                if (key) {
                    trackPlanet(key);
                }
            });
        });
        
        // Stop tracking button
        document.getElementById('stop-tracking').addEventListener('click', () => {
            stopTracking();
        });

        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Mobile panel toggles
        const controlPanel = document.getElementById('control-panel');
        const planetList = document.getElementById('planet-list');
        const toggleControlsBtn = document.getElementById('toggle-controls-btn');
        const togglePlanetsBtn = document.getElementById('toggle-planets-btn');
        
        toggleControlsBtn.addEventListener('click', () => {
            controlPanel.classList.toggle('visible');
            planetList.classList.remove('visible');
            toggleControlsBtn.classList.toggle('active');
            togglePlanetsBtn.classList.remove('active');
        });
        
        togglePlanetsBtn.addEventListener('click', () => {
            planetList.classList.toggle('visible');
            controlPanel.classList.remove('visible');
            togglePlanetsBtn.classList.toggle('active');
            toggleControlsBtn.classList.remove('active');
        });
        
        document.getElementById('close-controls').addEventListener('click', () => {
            controlPanel.classList.remove('visible');
            toggleControlsBtn.classList.remove('active');
        });
        
        document.getElementById('close-planets').addEventListener('click', () => {
            planetList.classList.remove('visible');
            togglePlanetsBtn.classList.remove('active');
        });
        
        // Close panels when clicking planet on mobile
        document.querySelectorAll('.planet-grid .planet-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                planetList.classList.remove('visible');
                togglePlanetsBtn.classList.remove('active');
            });
        });
        
        // Touch controls for mobile
        let touchStartDistance = 0;
        let initialPinchDistance = 0;
        
        container.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            } else if (e.touches.length === 2) {
                isDragging = false;
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                initialPinchDistance = Math.sqrt(dx * dx + dy * dy);
                touchStartDistance = cameraDistance;
            }
        }, { passive: true });
        
        container.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isDragging) {
                const deltaX = e.touches[0].clientX - previousMousePosition.x;
                const deltaY = e.touches[0].clientY - previousMousePosition.y;
                
                cameraAngleX -= deltaX * 0.008;
                cameraAngleY = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, cameraAngleY + deltaY * 0.008));
                
                updateCamera();
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            } else if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const currentDistance = Math.sqrt(dx * dx + dy * dy);
                
                const scale = initialPinchDistance / currentDistance;
                cameraDistance = Math.max(30, Math.min(800, touchStartDistance * scale));
                updateCamera();
            }
        }, { passive: true });
        
        container.addEventListener('touchend', () => {
            isDragging = false;
        });

        // Initialize and start
        init();
        animate();
    </script>
</body>
</html>
